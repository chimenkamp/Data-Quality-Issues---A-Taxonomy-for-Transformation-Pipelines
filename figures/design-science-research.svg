<svg xmlns="http://www.w3.org/2000/svg" width="1830" height="690" viewBox="0 0 1830 690" role="img" aria-labelledby="title description"><title id="title">Historical design-science research process</title><desc id="description">English recreation of the thesis diagram. This records the earlier framework research design, not a validation procedure for the current taxonomy paper.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.5 L0 7 Z" fill="#202020"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#111"><g id="step-0" data-kind="node"><rect x="24" y="130" width="280" height="269" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="164" y="169.2">Problem identification &amp;</tspan><tspan x="164" y="190">motivation</tspan></text><text text-anchor="middle" font-size="16"><tspan x="164" y="286.3">Missing assignment across a</tspan><tspan x="164" y="307.1">pipeline and description of</tspan><tspan x="164" y="327.90000000000003">effects.</tspan></text></g><path data-from="step-0" data-to="step-1" d="M304,247 L324,247" fill="none" stroke="#202020" stroke-width="3"/><g id="entry-0" data-kind="node" data-label="Problem-centered approach"><rect x="24" y="474" width="280" height="90" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16"><tspan x="164" y="524.6">Problem-centered approach</tspan></text></g><path data-from="entry-0" data-to="step-0" d="M164,474 L164,399" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="step-1" data-kind="node"><rect x="324" y="130" width="280" height="269" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="464" y="179.6">Objectives of a solution</tspan></text><text text-anchor="middle" font-size="16"><tspan x="464" y="286.3">Stage-by-stage representation</tspan><tspan x="464" y="307.1">of relevant DQIs and their</tspan><tspan x="464" y="327.90000000000003">effects.</tspan></text></g><path data-from="step-1" data-to="step-2" d="M604,247 L624,247" fill="none" stroke="#202020" stroke-width="3"/><path data-from="step-5" data-to="step-1" d="M1664,130 L1664,55 L464,55 L464,130" fill="none" stroke="#202020" stroke-width="1.3"/><g id="entry-1" data-kind="node" data-label="Objective-centered solution"><rect x="324" y="474" width="280" height="90" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3" stroke-dasharray="7 5"/><text text-anchor="middle" font-size="16"><tspan x="464" y="524.6">Objective-centered solution</tspan></text></g><path data-from="entry-1" data-to="step-1" d="M464,474 L464,399" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="step-2" data-kind="node"><rect x="624" y="130" width="280" height="269" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="764" y="179.6">Design &amp; development</tspan></text><text text-anchor="middle" font-size="16"><tspan x="764" y="286.3">Conceptual framework based on</tspan><tspan x="764" y="307.1">a systematic literature review</tspan><tspan x="764" y="327.90000000000003">and taxonomy development.</tspan></text></g><path data-from="step-2" data-to="step-3" d="M904,247 L924,247" fill="none" stroke="#202020" stroke-width="3"/><path data-from="step-5" data-to="step-2" d="M1664,130 L1664,55 L764,55 L764,130" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="entry-2" data-kind="node" data-label="Design- and development-centered approach"><rect x="624" y="474" width="280" height="90" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3" stroke-dasharray="7 5"/><text text-anchor="middle" font-size="16"><tspan x="764" y="514.2">Design- and</tspan><tspan x="764" y="535">development-centered approach</tspan></text></g><path data-from="entry-2" data-to="step-2" d="M764,474 L764,399" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="step-3" data-kind="node"><rect x="924" y="130" width="280" height="269" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="1064" y="179.6">Demonstration</tspan></text><text text-anchor="middle" font-size="16"><tspan x="1064" y="296.7">Examples of linked DQI effects</tspan><tspan x="1064" y="317.5">using the framework.</tspan></text></g><path data-from="step-3" data-to="step-4" d="M1204,247 L1224,247" fill="none" stroke="#202020" stroke-width="3"/><path data-from="step-5" data-to="step-3" d="M1664,130 L1664,55 L1064,55 L1064,130" fill="none" stroke="#202020" stroke-width="1.3"/><g id="entry-3" data-kind="node" data-label="Observation of a solution"><rect x="924" y="474" width="280" height="90" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3" stroke-dasharray="7 5"/><text text-anchor="middle" font-size="16"><tspan x="1064" y="524.6">Observation of a solution</tspan></text></g><path data-from="entry-3" data-to="step-3" d="M1064,474 L1064,399" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="step-4" data-kind="node"><rect x="1224" y="130" width="280" height="269" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="1364" y="179.6">Evaluation</tspan></text><text text-anchor="middle" font-size="16"><tspan x="1364" y="286.3">Assessment of fulfillment of</tspan><tspan x="1364" y="307.1">functional and nonfunctional</tspan><tspan x="1364" y="327.90000000000003">requirements.</tspan></text></g><path data-from="step-4" data-to="step-5" d="M1504,247 L1524,247" fill="none" stroke="#202020" stroke-width="3" marker-end="url(#arrow)"/><path data-from="step-5" data-to="step-4" d="M1664,130 L1664,55 L1364,55 L1364,130" fill="none" stroke="#202020" stroke-width="1.3"/><g id="step-5" data-kind="node"><rect x="1524" y="130" width="280" height="269" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="1664" y="179.6">Communication</tspan></text><text text-anchor="middle" font-size="16"><tspan x="1664" y="307.1">Presentation in this thesis.</tspan></text></g><path d="M24 586 L24 608 L1204 608 L1204 586 M614 608 L614 622" fill="none" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16"><tspan x="614" y="652.6">Possible entry points for research</tspan></text></g></svg>
