<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="310" viewBox="0 0 1700 310" role="img" aria-labelledby="title description"><title id="title">Transformation pipeline</title><desc id="description">English recreation of the source pipeline, including the dashed acquisition stage and the original intermediate-representation labels.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.5 L0 7 Z" fill="#202020"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#111"><g id="stage-0" data-kind="node" data-label="Data acquisition"><rect x="24" y="200" width="240" height="72" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3" stroke-dasharray="7 5"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="144" y="241.6">Data acquisition</tspan></text></g><path data-from="stage-0" data-to="stage-1" d="M264,236 L306,236" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="representation-0" data-kind="representation" data-label="Unstructured data"><ellipse cx="285" cy="86" rx="125" ry="54" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16"><tspan x="285" y="91.6">Unstructured data</tspan></text></g><path data-from="representation-0" data-to="stage-link-0" d="M285,140 L285,229" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="stage-1" data-kind="node" data-label="Preprocessing"><rect x="306" y="200" width="240" height="72" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="426" y="241.6">Preprocessing</tspan></text></g><path data-from="stage-1" data-to="stage-2" d="M546,236 L588,236" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="representation-1" data-kind="representation" data-label="Preprocessed unstructured data"><ellipse cx="567" cy="86" rx="125" ry="54" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16"><tspan x="567" y="81.2">Preprocessed unstructured</tspan><tspan x="567" y="102">data</tspan></text></g><path data-from="representation-1" data-to="stage-link-1" d="M567,140 L567,229" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="stage-2" data-kind="node" data-label="Abstraction / aggregation"><rect x="588" y="200" width="240" height="72" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="708" y="241.6">Abstraction / aggregation</tspan></text></g><path data-from="stage-2" data-to="stage-3" d="M828,236 L870,236" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="representation-2" data-kind="representation" data-label="Structured event data"><ellipse cx="849" cy="86" rx="125" ry="54" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16"><tspan x="849" y="91.6">Structured event data</tspan></text></g><path data-from="representation-2" data-to="stage-link-2" d="M849,140 L849,229" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="stage-3" data-kind="node" data-label="Case correlation"><rect x="870" y="200" width="240" height="72" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="990" y="241.6">Case correlation</tspan></text></g><path data-from="stage-3" data-to="stage-4" d="M1110,236 L1152,236" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="representation-3" data-kind="representation" data-label="Process instances"><ellipse cx="1131" cy="86" rx="125" ry="54" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16"><tspan x="1131" y="91.6">Process instances</tspan></text></g><path data-from="representation-3" data-to="stage-link-3" d="M1131,140 L1131,229" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="stage-4" data-kind="node" data-label="Process mining"><rect x="1152" y="200" width="240" height="72" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="1272" y="241.6">Process mining</tspan></text></g><path data-from="stage-4" data-to="stage-5" d="M1392,236 L1434,236" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="representation-4" data-kind="representation" data-label="Process model"><ellipse cx="1413" cy="86" rx="125" ry="54" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16"><tspan x="1413" y="91.6">Process model</tspan></text></g><path data-from="representation-4" data-to="stage-link-4" d="M1413,140 L1413,229" fill="none" stroke="#202020" stroke-width="1.3" marker-end="url(#arrow)"/><g id="stage-5" data-kind="node" data-label="Visualization"><rect x="1434" y="200" width="240" height="72" rx="5" fill="#fff" stroke="#202020" stroke-width="1.3"/><text text-anchor="middle" font-size="16" font-weight="700"><tspan x="1554" y="241.6">Visualization</tspan></text></g></g></svg>
